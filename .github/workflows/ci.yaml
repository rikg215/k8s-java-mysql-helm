name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  manifests:
    name: Lint chart & validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: helm lint
        run: helm lint charts/myapp -f values/myapp-values.yaml --set secretData.DB_PWD=ci-placeholder

      - name: Render chart and validate against the Kubernetes schema
        run: |
          helm template myapp charts/myapp -n devops-bootcamp \
            -f values/myapp-values.yaml --set secretData.DB_PWD=ci-placeholder \
            | kubeconform -strict -summary

      - name: Validate plain manifests
        run: kubeconform -strict -summary k8s/

  image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t myapp:ci .
