apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  type: {{ .Values.svcType }}
  selector:
    app: {{ .Values.appName }}
  ports:
  - port: {{ .Values.svcPort }}
    targetPort: {{ .Values.appPort }}
    protocol: TCP
