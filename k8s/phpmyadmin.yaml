apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: devops-bootcamp
  labels:
    app: phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
      - name: phpmyadmin
        image: phpmyadmin:5.2
        ports:
        - containerPort: 80
        env:
        - name: PMA_HOST
          value: mysql-primary
        - name: PMA_PORT
          value: "3306"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
---
# ClusterIP only: phpMyAdmin is never exposed outside the cluster.
# Access it with: kubectl port-forward -n devops-bootcamp svc/phpmyadmin 8080:8080
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: devops-bootcamp
  labels:
    app: phpmyadmin
spec:
  type: ClusterIP
  selector:
    app: phpmyadmin
  ports:
  - port: 8080
    targetPort: 80
    protocol: TCP
