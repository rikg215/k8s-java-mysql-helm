apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: devops-bootcamp
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      imagePullSecrets:
      - name: docker-auth
      containers:
      - image: rik215/bootcamp-test:my-app-1
        name: bootcamp-test
        ports:
        - containerPort: 8080
        env:
        - name: DB_PWD
          valueFrom:
            secretKeyRef:
              name: mysql
              key: mysql-password
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: mysql-cm
              key: username
        - name: DB_SERVER
          valueFrom:
            configMapKeyRef:
              name: mysql-cm
              key: server
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: mysql-cm
              key: dbname
